shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  simple-git-hooks: true
  spawn-sync: false
  unrs-resolver: false
  vue-demi: false
  workerd: false

overrides:
  # publish-browser-extension@6 sends the AMO sources zip as a bare Blob, so the
  # multipart part has no filename and AMO rejects it with "Unsupported file type".
  # https://github.com/aklinker1/publish-browser-extension/issues/90
  publish-browser-extension: 6.1.1
